name: Production build (fork)

# Fork-only. Builds the stable package (`com.beb.plxnative`) of the ref it is dispatched on and
# uploads it as an artifact; nothing is tagged, released or sent to Sentry.
# Telemetry credentials are the PLX_SENTRY_DSN / PLX_POSTHOG_KEY repository variables, which on
# this fork hold placeholders that cannot deliver anything.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-build
  cancel-in-progress: false

jobs:
  build:
    name: ARM build + gates
    uses: ./.github/workflows/build-package.yml
    with:
      ref: ${{ github.sha }}
      flavor: stable
      telemetry: production
      artifact: prod-package
      homebrew-manifest: false
      source-asset: false
      fwcompat: true
      upload-debug-files: false
      caches: false
    secrets:
      # Required by build-package.yml's signature but read only when upload-debug-files is true.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN || 'unused' }}
