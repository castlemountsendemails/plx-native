name: build firetv

# The Fire TV APK (armeabi-v7a, minSdk 25): SDL2, SDL2_ttf, FFmpeg and libcurl built with the NDK and
# cached, libmain.so from rust-modules/android through cargo-ndk, and the Gradle project in android/.
# One copy of that build: ci.yml calls it for the debug APK, release.yml for the release APK.

on:
  workflow_call:
    inputs:
      artifact:
        description: 'upload-artifact name for the APK, the LGPL source folder and the symbol copies.'
        type: string
        required: true
      release:
        description: 'Build the release-signed APK (com.beb.plxnative, no default features, blank telemetry) instead of the debug one.'
        type: boolean
        default: false
      version-name:
        description: 'versionName of the release APK.'
        type: string
        default: ''
      version-code:
        description: 'versionCode of the release APK.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    # Not yet measured; a cold run builds SDL2, SDL2_ttf and cargo-ndk.
    timeout-minutes: 30
    env:
      # One of the NDKs on the ubuntu-24.04 image; android/build.gradle.kts names the same one.
      ANDROID_NDK_VERSION: 27.3.13750724
      # The certificates the FIRETV_*_KEYSTORE_B64 secrets hold; ci/check-apk.sh fails an APK signed by any other.
      FIRETV_DEBUG_CERT_SHA256: C8:01:79:87:10:F1:F5:D5:BF:BB:48:96:EE:3D:6F:D4:FF:41:54:EA:34:54:F0:89:16:13:BE:67:35:5B:78:3F
      FIRETV_RELEASE_CERT_SHA256: F6:EB:3F:EB:72:C3:D8:15:84:90:03:A2:7A:3A:37:A0:5B:0E:CF:98:13:71:13:CC:98:89:63:2C:9D:F7:1D:0F
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the build identity
        # A debug build's versionName is what rust-modules/build.rs stamps into a non-RELEASE build: the next
        # minor plus -dev (ci/version_rule.py), so the APK, X-Plex-Version and the diagnostics panel agree.
        env:
          RELEASE: ${{ inputs.release }}
          RELEASE_NAME: ${{ inputs.version-name }}
          RELEASE_CODE: ${{ inputs.version-code }}
        run: |
          set -euo pipefail
          if [ "$RELEASE" = true ]; then
            [ -n "$RELEASE_NAME" ] && [ -n "$RELEASE_CODE" ] \
              || { echo "::error::a release build needs version-name and version-code"; exit 1; }
            {
              echo "FIRETV_TYPE=release"
              echo "FIRETV_PACKAGE=com.beb.plxnative"
              echo "FIRETV_VERSION_NAME=$RELEASE_NAME"
              echo "FIRETV_VERSION_CODE=$RELEASE_CODE"
              echo "FIRETV_CERT_SHA256=$FIRETV_RELEASE_CERT_SHA256"
              echo "FIRETV_DEBUGGABLE=false"
              echo "FIRETV_APK_SUFFIX="
            } >> "$GITHUB_ENV"
          else
            {
              echo "FIRETV_TYPE=debug"
              echo "FIRETV_PACKAGE=com.beb.plxnative.dev"
              echo "FIRETV_VERSION_CODE=900"
              echo "FIRETV_CERT_SHA256=$FIRETV_DEBUG_CERT_SHA256"
              echo "FIRETV_DEBUGGABLE=true"
              echo "FIRETV_APK_SUFFIX=-debug"
            } >> "$GITHUB_ENV"
            python3 - <<'PY' >> "$GITHUB_ENV"
          import subprocess, sys
          from pathlib import Path
          sys.path.insert(0, "ci")
          import version_rule
          tracked = subprocess.check_output([sys.executable, "ci/bump-version.py", "--current"], text=True).strip()
          line = Path("RELEASE_LINE")
          triplet, err = version_rule.next_version_triplet(tracked, line.read_text() if line.exists() else None)
          if triplet is None:
              sys.exit(err)
          print("FIRETV_VERSION_NAME=%d.%d.%d-dev" % triplet)
          PY
          fi

      - uses: ./.github/actions/rust-toolchain

      - name: Add the Android armv7 target
        run: rustup target add armv7-linux-androideabi --toolchain "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust-modules
          key: android

      - name: Cache the pinned downloads
        uses: ./.github/actions/deps-cache

      - name: Select the NDK and the SDL install prefix
        run: |
          echo "SDL_PREFIX=$HOME/.cache/plxnative/android-sdl" >> "$GITHUB_ENV"
          ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          if [ ! -d "$ndk" ]; then
            echo "::error::NDK $ANDROID_NDK_VERSION is not on this runner image"
            ls "$ANDROID_HOME/ndk"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Cache the NDK builds of SDL2 and SDL2_ttf
        id: sdl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SDL_PREFIX }}
          key: android-sdl-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('ci/build-android-sdl2.sh', 'ci/build-android-sdl2-ttf.sh', 'ci/dependencies.json', 'ci/sdl2-extracted-text.patch') }}

      - name: Build SDL2 and SDL2_ttf with the NDK
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          ci/build-android-sdl2.sh "$SDL_PREFIX"
          ci/build-android-sdl2-ttf.sh "$SDL_PREFIX"

      - name: Cache the NDK build of FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/ffmpeg-prefix-android
          key: android-ffmpeg-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('ci/build-ffmpeg.sh', 'ci/deps.py', 'ci/dependencies.json') }}

      - name: Build FFmpeg with the NDK
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          ANDROID: "1"
        run: ci/build-ffmpeg.sh

      - name: Check ff.rs's FFmpeg ABI table against the Android headers
        run: |
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang" \
            -I vendor/ffmpeg-prefix-android/include -std=c11 -c ci/ffabi-assert.c -o /dev/null

      - name: Cache the NDK build of libcurl and OpenSSL
        id: curl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/curl-prefix-android
          key: android-curl-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('ci/build-android-curl.sh', 'ci/dependencies.json') }}

      - name: Build libcurl and OpenSSL with the NDK
        if: steps.curl-cache.outputs.cache-hit != 'true'
        run: ci/build-android-curl.sh vendor/curl-prefix-android

      - name: Cache the NDK build of libass and its font stack
        id: libass-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/libass-prefix-android
          key: android-libass-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('ci/build-android-libass.sh', 'ci/build-libass.py', 'ci/deps.py', 'ci/dependencies.json', 'ci/patches/libass-*', 'src/ass.c', 'src/ass_fonts.c', 'src/ass_internal.h', 'src/ass_composite.h', 'include/ass.h') }}

      - name: Build libass with the NDK
        if: steps.libass-cache.outputs.cache-hit != 'true'
        run: ci/build-android-libass.sh

      - name: Install cargo-ndk
        # A no-op when rust-cache restored this version into ~/.cargo/bin.
        run: cargo "+$RUST_TOOLCHAIN" install cargo-ndk --version 4.1.2 --locked

      - name: Build libmain.so and stage the native libraries
        env:
          PLX_ANDROID_SDL_PREFIX: ${{ env.SDL_PREFIX }}
          # build.rs reports the plain version for a release build; the four telemetry variables stay empty.
          PLX_RELEASE: ${{ inputs.release && '1' || '' }}
          PLX_SENTRY_DSN: ''
          PLX_POSTHOG_KEY: ''
          PLX_SENTRY_DSN_DEV: ''
          PLX_POSTHOG_KEY_DEV: ''
        run: |
          set -euo pipefail
          libs="$RUNNER_TEMP/jniLibs"
          flags=()
          [ "$FIRETV_TYPE" = release ] && flags+=(--no-default-features)
          (cd rust-modules && cargo "+$RUST_TOOLCHAIN" ndk -t armeabi-v7a -P 25 -o "$libs" build --release -p plx_android "${flags[@]}")
          if [ "$FIRETV_TYPE" = release ] && strings "$libs/armeabi-v7a/libmain.so" | grep -E 'o0\.invalid|phc_'; then
            echo "::error::libmain.so carries telemetry credentials"
            exit 1
          fi
          cp "$SDL_PREFIX/lib/libSDL2.so" "$SDL_PREFIX/lib/libSDL2_ttf.so" "$libs/armeabi-v7a/"
          cp vendor/ffmpeg-prefix-android/lib/lib*-plx.so "$libs/armeabi-v7a/"
          cp vendor/curl-prefix-android/lib/libcurl-plx.so "$libs/armeabi-v7a/"
          cp vendor/libass-prefix-android/lib/libass-plx.so "$libs/armeabi-v7a/"
          ls -l "$libs/armeabi-v7a"
          # Gradle strips the libraries it packs; these copies keep the symbol table that names a tombstone's frames.
          mkdir -p "$RUNNER_TEMP/apk/symbols"
          cp "$libs/armeabi-v7a/libmain.so" "$libs/armeabi-v7a/libcurl-plx.so" "$RUNNER_TEMP/apk/symbols/"
          readelf -S "$RUNNER_TEMP/apk/symbols/libmain.so" | grep -q '\.symtab' \
            || { echo "::error::libmain.so has no symbol table to keep"; exit 1; }
          readelf -d "$libs/armeabi-v7a/libmain.so" | grep -E 'NEEDED|SONAME'
          # Android loads libraries RTLD_NOW, so a webOS-only symbol left undefined fails the app at start.
          # GL calls resolve from libGLESv2, which libmain.so must then need; svg_* must be linked in.
          und=$(readelf --dyn-syms -W "$libs/armeabi-v7a/libmain.so" | awk '$7 == "UND" {print $8}' | sort -u)
          echo "$und"
          if grep -E '^(sf_|vp_|acb_|LS|g_main_|wl_|svg_|plex_run$)' <<<"$und"; then
            echo "::error::libmain.so needs a webOS or unlinked symbol no Android library provides"
            exit 1
          fi
          if grep -q '^gl' <<<"$und" && ! readelf -d "$libs/armeabi-v7a/libmain.so" | grep -q 'NEEDED.*libGLESv2.so'; then
            echo "::error::libmain.so calls GL but does not need libGLESv2.so"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/assets/licenses"
          cp pkg/appfont.ttf pkg/appfont-bold.ttf pkg/appfont-emoji.ttf pkg/appfont-cjk.ttf pkg/le-roots.pem pkg/cacert.pem \
            LICENSE TRADEMARKS.md THIRD-PARTY-NOTICES-FIRETV.md "$RUNNER_TEMP/assets/"
          cp licenses/*.txt pkg/OFL.txt "$RUNNER_TEMP/assets/licenses/"
          mkdir -p "$RUNNER_TEMP/assets/fonts"
          cp -r pkg/fonts/subs "$RUNNER_TEMP/assets/fonts/"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: 8.14.3
          cache-provider: basic

      - name: Build, sign and check the APK
        working-directory: android
        env:
          FIRETV_DEBUG_KEYSTORE_B64: ${{ secrets.FIRETV_DEBUG_KEYSTORE_B64 }}
          FIRETV_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.FIRETV_DEBUG_KEYSTORE_PASSWORD }}
          FIRETV_DEBUG_KEY_ALIAS: ${{ secrets.FIRETV_DEBUG_KEY_ALIAS }}
          FIRETV_DEBUG_KEY_PASSWORD: ${{ secrets.FIRETV_DEBUG_KEY_PASSWORD }}
          FIRETV_RELEASE_KEYSTORE_B64: ${{ secrets.FIRETV_RELEASE_KEYSTORE_B64 }}
          FIRETV_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.FIRETV_RELEASE_KEYSTORE_PASSWORD }}
          FIRETV_RELEASE_KEY_ALIAS: ${{ secrets.FIRETV_RELEASE_KEY_ALIAS }}
          FIRETV_RELEASE_KEY_PASSWORD: ${{ secrets.FIRETV_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # build.gradle.kts reads the signing config of the selected type from FIRETV_<TYPE>_*.
          upper=${FIRETV_TYPE^^}
          b64="FIRETV_${upper}_KEYSTORE_B64"
          export "FIRETV_${upper}_KEYSTORE=$RUNNER_TEMP/$FIRETV_TYPE.jks"
          tr -d ' \r\n' <<<"${!b64}" | base64 --decode > "$RUNNER_TEMP/$FIRETV_TYPE.jks"
          gradle --no-daemon "assemble${FIRETV_TYPE^}" \
            "-Pplx.sdlJava=$SDL_PREFIX/java" \
            "-Pplx.jniLibs=$RUNNER_TEMP/jniLibs" \
            "-Pplx.assets=$RUNNER_TEMP/assets" \
            "-Pplx.versionCode=$FIRETV_VERSION_CODE" \
            "-Pplx.versionName=$FIRETV_VERSION_NAME"
          rm "$RUNNER_TEMP/$FIRETV_TYPE.jks"
          mkdir -p "$RUNNER_TEMP/apk"
          apk="$RUNNER_TEMP/apk/plxnative-$FIRETV_VERSION_NAME-firetv$FIRETV_APK_SUFFIX.apk"
          mv build/outputs/apk/$FIRETV_TYPE/*.apk "$apk"
          unzip -l "$apk" | grep -E 'lib/|assets/|classes'
          ../ci/check-apk.sh "$apk" "$FIRETV_PACKAGE" "$FIRETV_VERSION_CODE" "$FIRETV_VERSION_NAME" "$FIRETV_CERT_SHA256" "$FIRETV_DEBUGGABLE"

      # The LGPL corresponding source of the FFmpeg and (FriBidi, in libass-plx.so) the libass stack inside the APK:
      # the pinned tarballs, the patch, the facade and the scripts.
      - name: Stage the FFmpeg and libass source beside the APK
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/apk/lgpl-source"
          mkdir -p "$src"
          cp "$(python3 ci/deps.py fetch ffmpeg)" ci/build-ffmpeg.sh "$src/"
          for dep in freetype fribidi harfbuzz libunibreak libass; do cp "$(python3 ci/deps.py fetch "$dep")" "$src/"; done
          cp ci/build-android-libass.sh ci/build-libass.py ci/deps.py ci/dependencies.json ci/patches/libass-*.patch             src/ass.c src/ass_fonts.c src/ass_internal.h src/ass_composite.h include/ass.h "$src/"
          ls -l "$src"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact }}
          path: |
            ${{ runner.temp }}/apk/*.apk
            ${{ runner.temp }}/apk/lgpl-source/
            ${{ runner.temp }}/apk/symbols/
          if-no-files-found: error
